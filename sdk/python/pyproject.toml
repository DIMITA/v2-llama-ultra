[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "llama-ultra"
version = "1.2.0"
description = "Python SDK for LLaMA Ultra — run AI models on any machine"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
dev    = ["pytest>=7", "pytest-asyncio>=0.21", "respx>=0.20"]

[project.urls]
Homepage   = "https://github.com/dimita/v2-llama-ultra"
Repository = "https://github.com/dimita/v2-llama-ultra"

[tool.pytest.ini_options]
asyncio_mode = "auto"
